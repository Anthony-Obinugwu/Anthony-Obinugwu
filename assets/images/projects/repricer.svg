<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-repricer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a2a"/>
      <stop offset="100%" stop-color="#05140c"/>
    </linearGradient>
    <filter id="r-glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="500" height="280" fill="url(#bg-repricer)"/>
  <circle cx="250" cy="110" r="70" fill="rgba(255,255,255,0.06)"/>
  <circle cx="250" cy="110" r="50" fill="rgba(255,255,255,0.1)"/>
  <text x="250" y="125" font-size="48" text-anchor="middle" filter="url(#r-glow)">🏷️</text>
  <rect x="40" y="195" width="420" height="65" rx="8" fill="rgba(5, 16, 10, 0.75)" stroke="rgba(29, 185, 84, 0.4)" stroke-width="1"/>
  <text x="250" y="222" font-family="'Raleway', sans-serif" font-weight="bold" font-size="18" fill="#ffffff" text-anchor="middle">TdotWheels Repricer</text>
  <text x="250" y="245" font-family="sans-serif" font-size="12" fill="#22c55e" text-anchor="middle">Shopify Pricing Automation Engine</text>
</svg>
