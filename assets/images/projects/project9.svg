<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-project9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f4a47"/>
      <stop offset="100%" stop-color="#0d2120"/>
    </linearGradient>
    <filter id="p-glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="500" height="280" fill="url(#bg-project9)"/>
  <!-- UI Grid overlay -->
  <circle cx="250" cy="110" r="70" fill="rgba(255,255,255,0.06)"/>
  <circle cx="250" cy="110" r="50" fill="rgba(255,255,255,0.1)"/>

  <!-- Icon / Emoji -->
  <text x="250" y="125" font-size="48" text-anchor="middle" filter="url(#p-glow)">💬</text>

  <!-- Text -->
  <rect x="40" y="195" width="420" height="65" rx="8" fill="rgba(15, 10, 28, 0.75)" stroke="rgba(205, 95, 248, 0.4)" stroke-width="1"/>
  <text x="250" y="222" font-family="'Raleway', sans-serif" font-weight="bold" font-size="18" fill="#ffffff" text-anchor="middle">[PROJECT 9 TITLE]</text>
  <text x="250" y="245" font-family="sans-serif" font-size="12" fill="#c770f0" text-anchor="middle">[PROJECT 9 SUBTITLE]</text>
</svg>